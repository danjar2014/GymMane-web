services:
  - type: web
    runtime: static
    name: souyzgym
    staticPublishPath: ./dist
    headers:
      - path: /flutter_service_worker.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
