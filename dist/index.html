<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0C0B0A">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline gym log. No account, no ads.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SoyouzGym">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SoyouzGym</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#0C0B0A;margin:0">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <button id="install-btn" hidden aria-label="Installer SoyouzGym">Installer l'app</button>
  <style>
    #install-btn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:99999;
      background:#fff;color:#0C0B0A;border:0;border-radius:100px;padding:12px 20px;font:700 14px system-ui,sans-serif;
      box-shadow:0 4px 18px rgba(0,0,0,.45);cursor:pointer}
    #install-btn[hidden]{display:none}
  </style>
  <script>
    (function(){
      var btn=document.getElementById('install-btn'), deferred=null;
      var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
      if(standalone)return;
      window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;btn.hidden=false;});
      window.addEventListener('appinstalled',function(){btn.hidden=true;deferred=null;});
      var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
      if(ios)btn.hidden=false;
      btn.addEventListener('click',function(){
        if(deferred){deferred.prompt();deferred.userChoice.finally(function(){deferred=null;btn.hidden=true;});}
        else if(ios){alert("Pour installer : touchez le bouton Partager de Safari, puis « Sur l'écran d'accueil ».");}
      });
    })();
  </script>
</body>
</html>
